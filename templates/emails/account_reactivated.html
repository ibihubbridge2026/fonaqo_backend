{% extends "emails/base.html" %}
{% block title %}Compte réactivé{% endblock %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:22px;color:#0B0B0B;">Compte réactivé ✓</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#444;">
  Bonjour {{ user.first_name|default:user.username }}, votre compte FONACO a été réactivé.
  Vous pouvez à nouveau vous connecter normalement.
</p>
<a href="https://fonaco.app" style="display:inline-block;background:#FFD100;color:#0B0B0B;font-weight:700;font-size:15px;padding:14px 28px;border-radius:12px;text-decoration:none;">Se connecter</a>
{% endblock %}
