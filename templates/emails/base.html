<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}FONACO{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#F5F6FA;font-family:'Segoe UI',Inter,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F5F6FA;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06);">
          <tr>
            <td style="background:#FFD100;padding:28px 32px;text-align:center;">
              <div style="font-size:28px;font-weight:900;color:#0B0B0B;letter-spacing:-0.5px;">FONACO</div>
              <div style="font-size:11px;font-weight:600;color:#0B0B0B;opacity:0.7;margin-top:4px;text-transform:uppercase;letter-spacing:0.08em;">Ta mission, notre action.</div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#FAFAFA;border-top:1px solid #EEE;font-size:12px;color:#888;text-align:center;">
              © FONACO — Cet email a été envoyé automatiquement, merci de ne pas y répondre directement.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
