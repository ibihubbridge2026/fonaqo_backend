{% extends "super_admin/base_admin.html" %}
{% block title %}Activité{% endblock %}
{% block content %}

<div class="fq-hero" style="margin-bottom:24px">
  <div>
    <h2>Historique d'activité</h2>
    <p>Notifications, audit staff et événements mission</p>
  </div>
  <a href="{% url 'admin-dashboard' %}" class="fq-btn fq-btn-secondary fq-btn-sm">← Dashboard</a>
</div>

<div class="fq-card fq-card-padded">
  <div class="fq-section-header" style="margin-bottom:16px">
    <h3 class="fq-section-title flex items-center gap-2">
      Flux complet <span class="fq-live-dot"></span>
    </h3>
    <button type="button" id="activity-refresh-btn" class="fq-btn fq-btn-ghost fq-btn-sm">
      {% include "super_admin/partials/icon.html" with name="refresh" class="w-4 h-4" %}
      Actualiser
    </button>
  </div>
  <div id="activity-feed-full" class="fq-timeline min-h-[200px]">
    <div class="fq-skeleton h-12 w-full mb-2"></div>
    <div class="fq-skeleton h-12 w-full mb-2"></div>
    <div class="fq-skeleton h-12 w-full"></div>
  </div>
  <div class="flex items-center justify-between mt-6 pt-4 border-t border-[var(--fq-border-light)]">
    <p class="text-sm text-[var(--fq-muted)]" id="activity-page-info">—</p>
    <div class="flex gap-2">
      <button type="button" id="activity-prev-btn" class="fq-btn fq-btn-secondary fq-btn-sm" disabled>Précédent</button>
      <button type="button" id="activity-next-btn" class="fq-btn fq-btn-primary fq-btn-sm">Suivant</button>
    </div>
  </div>
</div>
{% endblock %}
